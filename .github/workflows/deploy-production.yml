name: Deploy Production

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-deploy
  cancel-in-progress: true

jobs:
  deploy:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    environment: production
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      DEPLOY_SHA: ${{ github.event_name == 'workflow_dispatch' && github.sha || github.event.workflow_run.head_sha }}
      NEXT_PUBLIC_BUILD_SHA: ${{ github.event_name == 'workflow_dispatch' && github.sha || github.event.workflow_run.head_sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Verify this CI run is still current main
        id: current
        shell: bash
        run: |
          set -euo pipefail
          current_sha="$(git rev-parse HEAD)"
          echo "current_sha=${current_sha}" >> "$GITHUB_OUTPUT"
          if [ "$current_sha" = "$DEPLOY_SHA" ]; then
            echo "is_latest=true" >> "$GITHUB_OUTPUT"
          else
            echo "is_latest=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Skipping stale deployment for $DEPLOY_SHA; main is $current_sha"
          fi

      - name: Check Cloudflare deployment credentials
        if: steps.current.outputs.is_latest == 'true'
        id: cloudflare
        shell: bash
        run: |
          if [ -n "$CLOUDFLARE_API_TOKEN" ] && [ -n "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Production deploy skipped because CLOUDFLARE_API_TOKEN and/or CLOUDFLARE_ACCOUNT_ID is not configured in the production GitHub environment."
          fi

      - uses: actions/setup-node@v4
        if: steps.current.outputs.is_latest == 'true' && steps.cloudflare.outputs.configured == 'true'
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        if: steps.current.outputs.is_latest == 'true' && steps.cloudflare.outputs.configured == 'true'
        run: npm ci

      - name: Build Cloudflare worker
        if: steps.current.outputs.is_latest == 'true' && steps.cloudflare.outputs.configured == 'true'
        run: npm run cf:build

      - name: Deploy Cloudflare worker
        if: steps.current.outputs.is_latest == 'true' && steps.cloudflare.outputs.configured == 'true'
        run: npx wrangler deploy

      - name: Verify production readiness and deployed commit
        if: steps.current.outputs.is_latest == 'true' && steps.cloudflare.outputs.configured == 'true'
        shell: bash
        run: |
          set -euo pipefail
          ready="$(curl --fail --silent --show-error --retry 5 --retry-delay 3 https://takemovereturn.com/api/ready)"
          version="$(curl --fail --silent --show-error --retry 5 --retry-delay 3 https://takemovereturn.com/api/version)"
          echo "ready=$ready"
          echo "version=$version"
          node -e '
            const ready = JSON.parse(process.argv[1]);
            const version = JSON.parse(process.argv[2]);
            const expected = process.env.DEPLOY_SHA;
            if (ready.status !== "ready") throw new Error("Production readiness check failed");
            if (version.commit !== expected) {
              throw new Error("Production commit mismatch: expected " + expected + ", got " + version.commit);
            }
          ' "$ready" "$version"

      - name: Record skipped deployment
        if: steps.current.outputs.is_latest == 'true' && steps.cloudflare.outputs.configured != 'true'
        run: |
          echo "Production deployment was not attempted because the GitHub production environment is missing Cloudflare credentials." >> "$GITHUB_STEP_SUMMARY"
          echo "Required secrets: CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID." >> "$GITHUB_STEP_SUMMARY"
