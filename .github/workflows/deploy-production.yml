name: Deploy Production

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-deploy
  cancel-in-progress: true

jobs:
  deploy:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    environment: production
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
      DEPLOY_SHA: ${{ github.event_name == 'workflow_dispatch' && github.sha || github.event.workflow_run.head_sha }}
      NEXT_PUBLIC_BUILD_SHA: ${{ github.event_name == 'workflow_dispatch' && github.sha || github.event.workflow_run.head_sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Verify this CI run is still current main
        id: current
        shell: bash
        run: |
          set -euo pipefail
          current_sha="$(git rev-parse HEAD)"
          echo "current_sha=${current_sha}" >> "$GITHUB_OUTPUT"
          if [ "$current_sha" = "$DEPLOY_SHA" ]; then
            echo "is_latest=true" >> "$GITHUB_OUTPUT"
          else
            echo "is_latest=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Skipping stale deployment for $DEPLOY_SHA; main is $current_sha"
          fi

      - name: Require production deployment credentials
        if: steps.current.outputs.is_latest == 'true'
        shell: bash
        run: |
          set -euo pipefail
          missing=0
          for name in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID SUPABASE_ACCESS_TOKEN SUPABASE_DB_PASSWORD SUPABASE_PROJECT_ID; do
            if [ -z "${!name}" ]; then
              echo "::error::Missing GitHub production secret: $name"
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            echo "Production deployment stopped before any database or Worker change." >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

      - uses: actions/setup-node@v4
        if: steps.current.outputs.is_latest == 'true'
        with:
          node-version: 22
          cache: npm

      - uses: supabase/setup-cli@v3
        if: steps.current.outputs.is_latest == 'true'
        with:
          version: 2.118.0

      - name: Install dependencies
        if: steps.current.outputs.is_latest == 'true'
        run: npm ci

      - name: Link production Supabase project
        if: steps.current.outputs.is_latest == 'true'
        run: supabase link --project-ref "$SUPABASE_PROJECT_ID"

      - name: Preview production database migrations
        if: steps.current.outputs.is_latest == 'true'
        run: supabase db push --dry-run --include-all

      - name: Apply production database migrations
        if: steps.current.outputs.is_latest == 'true'
        run: supabase db push --include-all

      - name: Build Cloudflare worker
        if: steps.current.outputs.is_latest == 'true'
        run: npm run cf:build

      - name: Deploy Cloudflare worker
        if: steps.current.outputs.is_latest == 'true'
        run: npx wrangler deploy

      - name: Verify production readiness and deployed commit
        if: steps.current.outputs.is_latest == 'true'
        shell: bash
        run: |
          set -euo pipefail
          ready="$(curl --fail --silent --show-error --retry 5 --retry-delay 3 https://takemovereturn.com/api/ready)"
          version="$(curl --fail --silent --show-error --retry 5 --retry-delay 3 https://takemovereturn.com/api/version)"
          echo "ready=$ready"
          echo "version=$version"
          node -e '
            const ready = JSON.parse(process.argv[1]);
            const version = JSON.parse(process.argv[2]);
            const expected = process.env.DEPLOY_SHA;
            if (ready.status !== "ready") throw new Error("Production readiness check failed");
            if (version.commit !== expected) {
              throw new Error("Production commit mismatch: expected " + expected + ", got " + version.commit);
            }
          ' "$ready" "$version"

      - name: Verify public SEO after deployment
        if: steps.current.outputs.is_latest == 'true'
        run: npm run seo:runtime -- https://takemovereturn.com --baseline seo-production.json

      - name: Save public SEO evidence
        if: always() && steps.current.outputs.is_latest == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: seo-production-${{ env.DEPLOY_SHA }}
          path: seo-production.json
          if-no-files-found: warn
          retention-days: 90
