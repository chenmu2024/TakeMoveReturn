name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  database:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: supabase/setup-cli@v3
        with:
          version: 2.118.0
      - run: supabase db start
      - run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - name: Run rollback-only database security tests
        run: |
          set -euo pipefail
          db_url="$(supabase status -o json | jq -er '.DB_URL')"
          for test_file in supabase/tests/*.sql; do
            echo "Running ${test_file}"
            psql "${db_url}" -v ON_ERROR_STOP=1 -f "${test_file}"
          done
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high
      - run: npm run typecheck
      - run: npm test
      - run: npm run db:audit
      - run: npm run seo:audit
      - run: npm run legal:audit
      - run: npm run release:audit
      - run: npm run build
      - run: npm run runtime:smoke
      - run: npm run load:smoke
      - run: npm run cf:build
      - run: npm run cf:dry-run
